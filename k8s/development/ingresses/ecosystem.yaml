apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: ecosystem
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "frontend,ws-gateway"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - code-roaster.ai
      secretName: tls-ecosystem
  rules:
    - host: code-roaster.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rest-gateway-service
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: ws-gateway-service
                port:
                  number: 80